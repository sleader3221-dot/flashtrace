name: CI

on:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # esptool / hypothesis tests must run in CI, never silently skip.
      FLASHTRACE_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Fetch ESP-IDF spiffsgen.py (pinned v5.3.1, for byte-identity tests)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/spiffsgen.py" \
            https://raw.githubusercontent.com/espressif/esp-idf/v5.3.1/components/spiffs/spiffsgen.py
          echo "FLASHTRACE_SPIFFSGEN=$RUNNER_TEMP/spiffsgen.py" >> "$GITHUB_ENV"
      - name: Tool versions
        run: |
          python -m esptool version
          ruff --version
          mypy --version
          pytest --version
      - name: Ruff
        run: |
          ruff check src tests tools
          ruff format --check src tests tools
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest
      - name: Cache benchmark corpus
        uses: actions/cache@v4
        with:
          path: .corpus
          key: corpus-v1-${{ hashFiles('tools/corpus/**', 'src/flashtrace/rules/**') }}
      - name: Generate benchmark corpus (deterministic; esptool merge-bin)
        run: |
          if [ ! -f .corpus/clean_control/ground_truth.json ]; then
            python -m tools.corpus.generate .corpus
          fi
          grep -h '"merge_tool"' .corpus/*/ground_truth.json | sort | uniq -c
      - name: Benchmark gate (recall >= 0.95, no forbidden rule, clean_control quiet)
        run: flashtrace bench .corpus --out bench_results.json
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ matrix.python-version }}
          path: bench_results.*
