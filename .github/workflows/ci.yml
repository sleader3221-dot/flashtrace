name: CI

on:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # esptool / hypothesis tests must run in CI, never silently skip.
      FLASHTRACE_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tool versions
        run: |
          python -m esptool version
          ruff --version
          mypy --version
          pytest --version
      - name: Ruff
        run: |
          ruff check src tests tools
          ruff format --check src tests tools
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest
